# walls, floor
# ! currently the aigen layout can not pass the assessertion in the scene construction process
room:
  walls:
    # Main wall (long side of the L-shape)
    - name: wall_main
      type: wall
      size: [4.0, 2.5, 0.02]
      pos: [4.0, 0, 2.5]

    - name: wall_main_backing
      type: wall
      backing: true
      backing_extended: [true, true]
      size: [4.0, 2.5, 0.1]
      pos: [4.0, 0, 2.5]

    # Left wall (short side of the L-shape)
    - name: wall_left
      type: wall
      wall_side: left
      size: [2.5, 2.5, 0.02]
      pos: [0, -2.5, 2.5]

    - name: wall_left_backing
      type: wall
      wall_side: left
      backing: true
      size: [2.5, 2.5, 0.1]
      pos: [0, -2.5, 2.5]

    # Right wall (extension of the L-shape)
    - name: wall_right
      type: wall
      wall_side: right
      size: [2.5, 2.5, 0.02]
      pos: [4.0, -2.5, 2.5]

    - name: wall_right_backing
      type: wall
      wall_side: right
      backing: true
      size: [2.5, 2.5, 0.1]
      pos: [4.0, -2.5, 2.5]

  wall_accessories:
    # Outlets on the left wall
    - name: outlet_left
      type: wall_accessory
      attach_to: wall_left
      pos: [null, -2.3, 1.2]

    # Outlets on the right wall
    - name: outlet_right_1
      type: wall_accessory
      attach_to: wall_right
      pos: [null, -2.7, 1.2]

    - name: outlet_right_2
      type: wall_accessory
      attach_to: wall_right
      pos: [null, -1.5, 1.2]


    # ! error: pos has null when as a xml to be loaded in mj
    # Light switches on the main wall
    # - name: light_switch_1
    #   type: wall_accessory
    #   config_name: light_switch
    #   attach_to: wall_main
    #   pos: [null, -3.8, 1.2]

    # - name: light_switch_2
    #   type: wall_accessory
    #   config_name: light_switch
    #   attach_to: wall_main
    #   pos: [null, -3.9, 1.2]

    # Utensil rack on the left wall
    - name: utensil_rack
      type: utensil_rack
      attach_to: wall_left
      pos: [null, -3.0, 1.15]

  floor:
    # Main floor (long side of the L-shape)
    - name: floor_main
      type: floor
      size: [4.0, 2.5, 0.02]
      pos: [4.0, -2.5, 0]

    - name: floor_main_backing
      type: floor
      backing: true
      size: [4.0, 2.5, 0.1]
      pos: [4.0, -2.5, 0]

    # Floor extension (short side of the L-shape)
    - name: floor_extension
      type: floor
      size: [2.5, 2.5, 0.02]
      pos: [0, -2.5, 0]

    - name: floor_extension_backing
      type: floor
      backing: true
      size: [2.5, 2.5, 0.1]
      pos: [0, -2.5, 0]

# fixtures on the left wall (short side of the L-shape)
left_group:
  group_origin: [0, 0]
  group_pos: [0, -3.0]
  group_z_rot: 1.5708

  # Bottom row (counters and appliances)
  bottom_row:
    - name: fridge
      type: fridge
      size: [1.0, 0.9, 1.8]
      pos: [2.7, -0.5, 0.9]

    - name: sink
      type: sink

    - name: counter_left
      type: counter
      interior_obj: sink
      size: [2.5, 0.7, 0.95]
      align_to: fridge
      side: left
      alignment: bottom_back
      obj_x_percent: 0.75
      obj_y_percent: 0.5

  # Top row (cabinets)
  top_row:
    - name: cab_1
      type: hinge_cabinet
      default_config_name: cab_top
      size: [1.0, 0.45, 0.95]
      pos: [-0.2, -0.25, 1.9]

    - name: cab_2
      type: open_cabinet
      default_config_name: shelves
      size: [0.8, 0.45, 0.95]
      align_to: cab_1
      side: right

    - name: window_group
      type: framed_window
      size: [1.8, 0.05, 1.3]
      num_windows: 3
      align_to: cab_2
      side: right
      ofs: [0.0, 0.25, -0.1]
      offset: [0.08, 0, 0]

  # Cabinets built into counters
  bottom_row_cabinets:
    - name: stack_1
      type: stack
      levels: ["drawer", "drawer", "drawer", "drawer"]
      percentages: [0.25, 0.25, 0.25, 0.25]
      size: [0.8, 0.65, 0.88]
      pos: [-0.3, -0.35, 0.5]

    - name: stack_2
      type: stack
      levels: ["hinge_cabinet", ["drawer", "drawer"]]
      percentages: [0.75, 0.25]
      size: [0.85, 0.65, 0.88]
      align_to: stack_1
      side: right

    - name: dishwasher
      type: dishwasher
      size: [0.7, 0.65, 0.92]
      align_to: stack_2
      side: right
      alignment: top_back

# fixtures on the main wall (long side of the L-shape)
main_group:
  group_origin: [0, 0]
  group_pos: [4.0, 0]
  group_z_rot: -1.5708

  # Bottom row (counters and stoves)
  bottom_row:
    - name: counter_main
      type: counter
      size: [3.5, 0.7, 0.95]
      pos: [1.75, -0.35, 0.5]

    - name: stove
      type: stove
      size: [null, 0.7, null]
      align_to: counter_main
      side: right
      alignment: top_back

    - name: counter_right
      type: counter
      size: [3.5, 0.7, 0.95]
      align_to: stove
      alignment: top_back
      side: right

  # Top row (cabinets and microwaves)
  top_row:
    - name: cab_main
      type: hinge_cabinet
      default_config_name: cab_top
      size: [1.0, 0.45, 0.95]
      pos: [0.5, -0.25, 1.9]

    - name: cab_1
      type: hinge_cabinet
      default_config_name: cab_top
      size: [1.0, 0.45, 0.95]
      align_to: cab_main
      side: right

    # Microwaves on the counter
    - name: microwave_1
      type: microwave
      size: [0.6, 0.5, 0.4]
      pos: [1.0, -0.35, 0.95]

    - name: microwave_2
      type: microwave
      size: [0.6, 0.5, 0.4]
      pos: [1.8, -0.35, 0.95]

    - name: microwave_3
      type: microwave
      size: [0.6, 0.5, 0.4]
      pos: [2.6, -0.35, 0.95]

    - name: microwave_4
      type: microwave
      size: [0.6, 0.5, 0.4]
      pos: [3.4, -0.35, 0.95]

    - name: microwave_5
      type: microwave
      size: [0.6, 0.5, 0.4]
      pos: [4.2, -0.35, 0.95]

  # Cabinets built into counters
  bottom_row_cabinets:
    - name: stack_1
      type: stack
      levels: ["hinge_cabinet", ["drawer", "drawer"]]
      percentages: [0.75, 0.25]
      size: [1.0, 0.65, 0.88]
      pos: [0.5, -0.35, 0.5]

    - name: stack_2
      type: stack
      levels: ["drawer", "drawer", "drawer", "drawer"]
      percentages: [0.25, 0.25, 0.25, 0.25]
      size: [1.0, 0.65, 0.88]
      align_to: stack_1
      side: right

  counter_accessories:
    - name: coffee_machine
      type: coffee_machine
      placement:
        fixture: counter_main_main_group
        sample_region_kwargs:
          ref: cab_1_main_group
        size: [1.0, 0.55]
        pos: [null, 1.0]
        rotation: [0, 0]
        margin: 0.0

    - name: utensil_holder
      type: utensil_holder
      placement:
        fixture: counter_main_main_group
        sample_region_kwargs:
          ref: cab_main_main_group
        size: [1.0, 0.35]
        pos: [null, 1.0]
        rotation: [0, 0]

    - name: toaster
      type: toaster
      placement:
        fixture: counter_right_main_group
        size: [1.0, 0.45]
        pos: [null, 1.0]
        rotation: [0, 0]

    # - name: knife_block
    #   type: knife_block
    #   placement:
    #     fixture: counter_left_group
    #     sample_region_kwargs:
    #       ref: cab_1_left_group
    #     size: [1.0, obj]
    #     pos: [null, 1.0]
    #     rotation: [0, 0]